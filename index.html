<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NewBit • ꔘ ᗲ</title>
  <style>
    :root{
      --bg:#000;
      --text:#ffffff;
      --muted:#9aa7bb;
      --accent:#0047AB; /* 사용자 지정 컬러 */
      --accent-2:#6be0ff;
      --card: rgba(255,255,255,0.03);
      --glass: rgba(255,255,255,0.02);
      --radius:14px;
      --max-width:1100px;
      --gap:18px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family: Inter, "Noto Sans KR", system-ui, -apple-system, "Segoe UI", Roboto, Arial;
      background:var(--bg);
      color:var(--text);
      padding:36px 20px;
      display:flex;
      justify-content:center;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
      line-height:1.4;
    }
    .wrap{width:100%;max-width:var(--max-width)}

    /* HEADER CARD (요청한 사각 틀) */
    .header-card{
      border-radius:18px;
      border:2px solid var(--accent);
      padding:18px;
      background: linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      display:flex;
      flex-direction:column;
      gap:14px;
      align-items:stretch;
    }

    /* Top row: logo left / NewBit stack right */
    .top-row{
      display:flex;
      gap:18px;
      align-items:center;
      justify-content:flex-start;
    }
    .logo-box{
      width:132px;
      height:132px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(135deg, rgba(0,71,171,0.12), rgba(107,224,255,0.02));
      box-shadow: 0 8px 30px rgba(0,71,171,0.08);
      border:1px solid rgba(255,255,255,0.04);
      flex:0 0 auto;
    }
    .logo{
      font-family: "Segoe UI Symbol", "Noto Sans", system-ui;
      font-weight:900;
      font-size:72px; /* 가장 큼 */
      line-height:0.95;
      color:var(--accent-2);
      text-shadow:
        0 0 12px rgba(107,224,255,0.06),
        0 0 22px rgba(0,71,171,0.12);
    }

    /* Brand stacked to the right of logo */
    .brand-stack{
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:6px;
      flex:1 1 auto;
      min-width:0;
    }
    .brand-main{
      font-size:28px; /* NewBit (위) */
      font-weight:800;
      color:var(--text);
      letter-spacing:0.6px;
    }
    .brand-sub{
      font-size:18px; /* 뉴빗 (아래) */
      color:var(--muted);
      font-weight:700;
    }

    /* Names row inside card */
    .names-row{
      display:flex;
      gap:14px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:6px;
    }
    .name-pill{
      padding:8px 12px;
      border-radius:10px;
      background:rgba(255,255,255,0.02);
      border:1px solid rgba(255,255,255,0.02);
      color:var(--text);
      font-weight:700;
      min-width:72px;
      text-align:center;
      font-size:14px;
    }

    /* Divider line (---) */
    .divider{
      height:1px;
      background:linear-gradient(90deg, rgba(255,255,255,0.02), var(--accent), rgba(255,255,255,0.02));
      border-radius:2px;
      margin:6px 0;
      box-shadow:0 1px 0 rgba(0,0,0,0.6) inset;
    }

    /* Click button centered */
    .click-row{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:12px;
      padding:6px 0 4px;
    }
    .click-btn{
      padding:8px 18px;
      border-radius:10px;
      background:transparent;
      color:var(--accent);
      border:2px solid var(--accent);
      font-weight:700;
      cursor:pointer;
      transition:all .18s ease;
      font-size:14px;
    }
    .click-btn.open{
      background:var(--accent);
      color:#fff;
      box-shadow:0 10px 30px rgba(0,71,171,0.12);
      transform:translateY(-2px);
    }

    /* Collapsible group info inside the same card (아래로 펼쳐짐) */
    .group-panel{
      overflow:hidden;
      transition:all .36s cubic-bezier(.2,.9,.2,1);
      max-height:0;
      opacity:0;
      padding:0 8px;
      border-radius:10px;
      margin-top:0;
    }
    .group-panel.open{
      max-height:480px;
      opacity:1;
      padding:12px 12px 18px 12px;
    }
    .group-panel .gi-inner{
      background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));
      border-radius:10px;
      border:1px solid rgba(255,255,255,0.03);
      padding:12px;
      color:var(--muted);
      line-height:1.6;
      font-size:14px;
    }

    /* keep a small TOC beneath header-card (optional) */
    .toc{
      display:flex;
      gap:10px;
      justify-content:center;
      margin-top:12px;
      flex-wrap:wrap;
    }
    .toc a{
      color:var(--muted);
      text-decoration:none;
      padding:8px 12px;
      border-radius:10px;
      border:1px solid transparent;
      transition:all .18s ease;
      font-weight:600;
      font-size:13px;
      background:transparent;
    }
    .toc a:hover{ color:#fff; border-color: rgba(0,71,171,0.12); }

    /* MEMBERS area */
    .section-head{ display:flex; align-items:center; justify-content:space-between; margin:26px 0 12px 0; }
    .section-head h3{ margin:0; font-size:16px; letter-spacing:2px; color:var(--text); }
    .section-head .hint{ color:var(--muted); font-size:13px; }

    .members-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap:16px; }
    .member-card{ display:block; background:var(--card); border-radius:12px; padding:12px; text-align:center; text-decoration:none; color:inherit; border:1px solid rgba(255,255,255,0.02); transition:transform .18s ease, box-shadow .18s ease; }
    .member-card:hover{ transform:translateY(-8px); box-shadow:0 18px 40px rgba(0,71,171,0.06); border-color: rgba(0,71,171,0.12); }
    .avatar{ width:100%; aspect-ratio:1/1; border-radius:10px; overflow:hidden; background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); display:flex; align-items:center; justify-content:center; }
    .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }
    .member-name{ margin-top:10px; font-weight:700; font-size:15px; }
    .member-role{ margin-top:6px; color:var(--muted); font-size:12px; }

    .details{ margin-top:34px; display:flex; flex-direction:column; gap:22px; }
    .detail{ background:var(--glass); padding:18px; border-radius:12px; border:1px solid rgba(255,255,255,0.02); }
    .detail h2{ margin:0; font-size:20px; }
    .detail .meta{ color:var(--muted); font-size:13px; margin-top:6px; }
    .detail .content{ margin-top:12px; color:var(--muted); font-size:15px; line-height:1.7; min-height:48px; }

    footer{ margin-top:36px; text-align:center; color:var(--muted); font-size:13px; }

    @media(max-width:720px){
      .logo-box{ width:100px; height:100px }
      .logo{ font-size:56px }
      .brand-main{ font-size:22px }
      .brand-sub{ font-size:14px }
      .names-row{ gap:8px }
    }

    /* anchor offset */
    .anchor-offset{ position:relative; top:-18px; padding-top:18px; margin-top:-18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <!-- HEADER CARD -->
    <div class="header-card" role="banner" aria-label="NewBit header">
      <div class="top-row">
        <div class="logo-box" aria-hidden="true">
          <div class="logo">ꔘ ᗲ</div>
        </div>

        <div class="brand-stack" aria-hidden="false">
          <div class="brand-main">NewBit</div>
          <div class="brand-sub">뉴빗</div>
          <!-- names moved inside the same card but below the brand visual -->
          <div style="height:8px"></div>
        </div>
      </div>

      <!-- Names row (inside card) -->
      <div class="names-row" aria-label="Member names">
        <div class="name-pill">서하</div>
        <div class="name-pill">온도</div>
        <div class="name-pill">영하</div>
        <div class="name-pill">은</div>
        <div class="name-pill">신우</div>
      </div>

      <div class="divider" aria-hidden="true"></div>

      <!-- CLICK button that toggles the GROUP INFO (NewBit 소개) -->
      <div class="click-row">
        <button id="group-toggle" class="click-btn" aria-expanded="false" aria-controls="group-panel">[CLICK]</button>
      </div>

      <!-- Collapsible group info panel inside card -->
      <div id="group-panel" class="group-panel" aria-hidden="true">
        <div class="gi-inner" id="group-info" role="region" aria-live="polite">
          <!-- 기본 텍스트; 수정하려면 여기에 내용을 직접 바꾸세요 -->
          <strong>NewBit</strong><br>
          NewBit(뉴빗)는 신규 아이돌 유닛입니다. 이 곳에 그룹 소개 문구, 활동 정보, 콘셉트나 멤버 구성 같은 설명을 적어주세요.
        </div>
      </div>
    </div>

    <!-- optional small TOC for quick scroll -->
    <nav class="toc" aria-label="Members quick navigation" style="margin-top:12px">
      <a href="#seoha">서하</a>
      <a href="#ondo">온도</a>
      <a href="#yeongha">영하</a>
      <a href="#eun">은</a>
      <a href="#shinwoo">신우</a>
    </nav>

    <!-- MEMBERS / Cards -->
    <main>
      <section>
        <div class="section-head">
          <h3>MEMBERS</h3>
          <div class="hint">카드를 클릭하면 아래 상세 정보로 이동합니다</div>
        </div>

        <div class="members-grid" id="members">
          <a class="member-card" href="#seoha">
            <div class="avatar">
              <img src="images/seoha.jpg" alt="서하" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22><rect width=%22600%22 height=%22600%22 fill=%22%230b0b0b%22/><text x=%2230%25%22 y=%2255%25%22 fill=%22%23aaa%22 font-size=%2240%22 font-family=%22sans-serif%22>서하</text></svg>'">
            </div>
            <div class="member-name">서하</div>
            <div class="member-role"></div>
          </a>

          <a class="member-card" href="#ondo">
            <div class="avatar">
              <img src="images/ondo.jpg" alt="온도" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22><rect width=%22600%22 height=%22600%22 fill=%22%230b0b0b%22/><text x=%2230%25%22 y=%2255%25%22 fill=%22%23aaa%22 font-size=%2240%22 font-family=%22sans-serif%22>온도</text></svg>'">
            </div>
            <div class="member-name">온도</div>
            <div class="member-role"></div>
          </a>

          <a class="member-card" href="#yeongha">
            <div class="avatar">
              <img src="images/yeongha.jpg" alt="영하" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22><rect width=%22600%22 height=%22600%22 fill=%22%230b0b0b%22/><text x=%2230%25%22 y=%2255%25%22 fill=%22%23aaa%22 font-size=%2240%22 font-family=%22sans-serif%22>영하</text></svg>'">
            </div>
            <div class="member-name">영하</div>
            <div class="member-role"></div>
          </a>

          <a class="member-card" href="#eun">
            <div class="avatar">
              <img src="images/eun.jpg" alt="은" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22><rect width=%22600%22 height=%22600%22 fill=%22%230b0b0b%22/><text x=%2230%25%22 y=%2255%25%22 fill=%22%23aaa%22 font-size=%2240%22 font-family=%22sans-serif%22>은</text></svg>'">
            </div>
            <div class="member-name">은</div>
            <div class="member-role"></div>
          </a>

          <a class="member-card" href="#shinwoo">
            <div class="avatar">
              <img src="images/shinwoo.jpg" alt="신우" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22600%22 height=%22600%22><rect width=%22600%22 height=%22600%22 fill=%22%230b0b0b%22/><text x=%2230%25%22 y=%2255%25%22 fill=%22%23aaa%22 font-size=%2240%22 font-family=%22sans-serif%22>신우</text></svg>'">
            </div>
            <div class="member-name">신우</div>
            <div class="member-role"></div>
          </a>
        </div>
      </section>

      <!-- DETAILS -->
      <section class="details" id="member-details" aria-live="polite">
        <div id="seoha" class="anchor-offset"></div>
        <article class="detail" aria-labelledby="seoha-title">
          <div class="title"><h2 id="seoha-title">서하</h2><div class="meta"></div></div>
          <div class="content" id="seoha-content"><!-- 서하 상세 소개 작성 --> </div>
        </article>

        <div id="ondo" class="anchor-offset"></div>
        <article class="detail" aria-labelledby="ondo-title">
          <div class="title"><h2 id="ondo-title">온도</h2><div class="meta"></div></div>
          <div class="content" id="ondo-content"><!-- 온도 상세 소개 작성 --> </div>
        </article>

        <div id="yeongha" class="anchor-offset"></div>
        <article class="detail" aria-labelledby="yeongha-title">
          <div class="title"><h2 id="yeongha-title">영하</h2><div class="meta"></div></div>
          <div class="content" id="yeongha-content"><!-- 영하 상세 소개 작성 --> </div>
        </article>

        <div id="eun" class="anchor-offset"></div>
        <article class="detail" aria-labelledby="eun-title">
          <div class="title"><h2 id="eun-title">은</h2><div class="meta"></div></div>
          <div class="content" id="eun-content"><!-- 은 상세 소개 작성 --> </div>
        </article>

        <div id="shinwoo" class="anchor-offset"></div>
        <article class="detail" aria-labelledby="shinwoo-title">
          <div class="title"><h2 id="shinwoo-title">신우</h2><div class="meta"></div></div>
          <div class="content" id="shinwoo-content"><!-- 신우 상세 소개 작성 --> </div>
        </article>
      </section>

      <footer></footer>
    </main>
  </div>

  <script>
    (function(){
      const toggleBtn = document.getElementById('group-toggle');
      const panel = document.getElementById('group-panel');

      toggleBtn.addEventListener('click', ()=>{
        const isOpen = panel.classList.toggle('open');
        toggleBtn.classList.toggle('open', isOpen);
        toggleBtn.setAttribute('aria-expanded', String(isOpen));
        panel.setAttribute('aria-hidden', String(!isOpen));
        // if opened, scroll into view
        if(isOpen) panel.scrollIntoView({behavior:'smooth', block:'center'});
      });

      // Smooth anchor handling for internal links
      const anchors = document.querySelectorAll('a[href^="#"]');
      anchors.forEach(a=>{
        a.addEventListener('click', (e)=>{
          const href = a.getAttribute('href');
          if(!href || href === '#') return;
          const id = href.slice(1);
          const el = document.getElementById(id);
          if(el){
            e.preventDefault();
            el.scrollIntoView({behavior:'smooth', block:'start'});
            history.replaceState(null,'','#'+id);
          }
        });
      });
    })();
  </script>
</body>
</html>
